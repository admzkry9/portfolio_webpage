<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Adam Zikry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .error {
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 2rem;
    }
    .error h1 {
      font-size: clamp(5rem, 15vw, 10rem);
      line-height: 1;
    }
    .error p {
      color: var(--muted);
      margin: 1rem 0 2rem;
    }
  </style>
</head>
<body>
  <main class="error">
    <div>
      <p class="eyebrow">Page not found</p>
      <h1 class="grad">404</h1>
      <p>Looks like this page wandered off into another timeline.</p>
      <a href="/" class="btn btn--primary">Back to portfolio</a>
    </div>
  </main>
</body>
</html>
